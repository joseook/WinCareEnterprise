# CI - Windows PowerShell 5.1 (real WPF/CIM) + pwsh on Linux.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 (Pester + WPF load + real CIM)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pester 5 and PSScriptAnalyzer
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Tests
        shell: powershell
        run: .\scripts\Invoke-WinCareTests.ps1
      - name: UI screenshots (real WPF render)
        if: always()
        timeout-minutes: 10
        shell: powershell
        run: powershell.exe -NoProfile -STA -File .\tests\Windows\Export-WinCareScreenshots.ps1
      - name: Site launcher check (irm on PS 5.1; parse only, never executed)
        if: always()
        timeout-minutes: 5
        shell: powershell
        run: |
          $r = Invoke-RestMethod -Uri 'https://wincare.joseok.cloud/run' -UseBasicParsing
          if ($r -isnot [string]) { throw ('irm returned ' + $r.GetType().FullName) }
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($r, [ref]$null, [ref]$errs)
          if (@($errs).Count -gt 0) { throw 'run does not parse' }
          if ($r -notmatch "-ExecutionPolicy RemoteSigned -File") { throw 'unexpected launcher content' }
          Write-Host ('OK: string of {0} chars, parses' -f $r.Length)
      - name: Headless diagnostic report
        if: always()
        timeout-minutes: 10
        shell: powershell
        run: .\src\Start-WinCare.ps1 -NoGui -OutputPath .\TestResults\diagnostic.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-ps51-results
          path: TestResults/
  pwsh-linux:
    name: pwsh on Linux (portable logic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pester 5 and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Tests
        shell: pwsh
        run: ./scripts/Invoke-WinCareTests.ps1
